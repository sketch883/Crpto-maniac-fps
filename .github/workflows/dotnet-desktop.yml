name: .NET Desktop Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore solution
      run: msbuild Crypto-maniac-fps.sln /t:Restore

    - name: Build solution
      run: dotnet build Crypto-maniac-fps.sln -c Release

    - name: Run unit tests
      run: dotnet test Crypto-maniac-fps/Crypto-maniac-fps.csproj --no-build --verbosity normal

    - name: Publish app
      run: dotnet publish Crypto-maniac-fps/Crypto-maniac-fps.csproj -c Release -o publish

    - name: Upload packaged build
      uses: actions/upload-artifact@v4
      with:
        name: CryptoManiac-Build
        path: publish
